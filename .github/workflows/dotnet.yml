name: Build Local Plugin

permissions:
  contents: write

on:
  workflow_dispatch: # 👈 核心修改 1：允许你在网页上手动点击运行
  push:
    branches:
      - main
      - master     # 👈 核心修改 2：只要你提交代码到主分支，它就自动运行

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: |
          Write-Host "Repo name from github.event.repository.name: $env:REPO_NAME"
          dotnet build ".\$env:REPO_NAME\$env:REPO_NAME.csproj" --configuration Release --no-incremental --force

      - name: Upload Artifact  # 👈 核心修改 3：直接打包让你下载，不搞复杂的 Release
        uses: actions/upload-artifact@v4
        with:
          name: LocalFilePlugin
          path: ./.artifacts/plugins/*.spkg